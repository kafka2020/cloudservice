version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: cloud-db
    environment:
      POSTGRES_DB: cloud
      POSTGRES_USER: cloud
      POSTGRES_PASSWORD: cloud
    ports:
      - "5432:5432"
    volumes:
      - cloud-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloud -d cloud"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: cloud-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/cloud
      DB_USER: cloud
      DB_PASSWORD: cloud
      JWT_SECRET: super-secret-jwt-key-change-me-please-32
      ALLOWED_ORIGINS: http://localhost:8081
    ports:
      - "8080:8080"

volumes:
  cloud-db-data:
