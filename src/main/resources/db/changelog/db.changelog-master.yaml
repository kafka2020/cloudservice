databaseChangeLog:
  - changeSet:
      id: 1-create-users
      author: cloudservice
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: login
                  type: varchar(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: varchar(255)
                  constraints:
                    nullable: false

  - changeSet:
      id: 2-create-files
      author: cloudservice
      changes:
        - createTable:
            tableName: files
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_files_users
                    references: users(id)
              - column:
                  name: filename
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: size
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: content_type
                  type: varchar(255)
              - column:
                  name: data
                  type: bytea
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: files
            columnNames: user_id, filename
            constraintName: uq_files_user_filename

  - changeSet:
      id: 3-seed-demo-user
      author: cloudservice
      changes:
        # Логин: user1, пароль: password (BCrypt-хэш сгенерирован заранее).
        # Не используй в продакшене — это только для тестирования FRONT.
        - insert:
            tableName: users
            columns:
              - column:
                  name: login
                  value: user1
              - column:
                  name: password
                  value: $2a$10$7E0a6VfWQfV9MwZ9jvR2VeQYFy0c1V8JtjPofZ1q2t2bqrGbQ0fS6
