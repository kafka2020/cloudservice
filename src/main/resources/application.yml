server:
  port: 8080

spring:
  application:
    name: cloudservice
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cloud}
    username: ${DB_USER:cloud}
    password: ${DB_PASSWORD:cloud}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${JWT_SECRET:change-me-please-change-me-please-32+}
    expiration-ms: ${JWT_EXP_MS:3600000}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:8081}

logging:
  level:
    ru.netology.cloudservice: INFO
    org.springframework.security: INFO
