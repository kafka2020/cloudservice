server:
  port: 8080

spring:
  application:
    name: cloudservice
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cloud}
    username: ${DB_USER:cloud}
    password: ${DB_PASSWORD:cloud}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
